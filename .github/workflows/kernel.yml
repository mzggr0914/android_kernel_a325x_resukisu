name: A325N Kernel

on:
  push:
    branches:
      - common
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag for manual publish (example: v4.2.0-35072)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: a325n-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT_DIR: ${{ github.workspace }}/out-ci
  PACKAGE_DIR: ${{ github.workspace }}/package-ci
  TOOLCHAIN_REPO: ZyCromerZ/Clang
  TOOLCHAIN_RELEASE: 14.0.6-20260619-release
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c

jobs:
  build:
    name: Build A325N kernel
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout kernel and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore full submodule history and tags
        shell: bash
        run: |
          set -euo pipefail
          git submodule foreach --recursive '
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow --tags --force
            else
              git fetch --tags --force
            fi
          '

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl file flex git \
            libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 unzip xz-utils zip zlib1g-dev zstd

          echo "pahole: $(command -v pahole)"
          pahole --version

      - name: Download ZyC toolchain
        id: toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$RUNNER_TEMP/zyc-release.json"
          unpack="$RUNNER_TEMP/zyc-clang"
          rm -rf "$unpack"
          mkdir -p "$unpack"

          api="https://api.github.com/repos/${TOOLCHAIN_REPO}/releases/tags/${TOOLCHAIN_RELEASE}"
          echo "Resolving ZyC release assets: ${TOOLCHAIN_REPO}@${TOOLCHAIN_RELEASE}"

          # Try authenticated API first, then public API as a fallback.
          if ! curl --fail --location --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$api" -o "$release_json"; then
            echo "::warning::Authenticated release lookup failed; retrying without auth."
            curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              "$api" -o "$release_json"
          fi

          echo "Release assets:"
          jq -r '.assets[] | "  \(.name)  \(.size) bytes"' "$release_json"

          asset_name="$(
            jq -r '
              [.assets[]
               | select(
                   (.name | ascii_downcase | endswith(".tar.gz")) or
                   (.name | ascii_downcase | endswith(".tgz")) or
                   (.name | ascii_downcase | endswith(".tar.xz")) or
                   (.name | ascii_downcase | endswith(".txz")) or
                   (.name | ascii_downcase | endswith(".tar.zst")) or
                   (.name | ascii_downcase | endswith(".tzst")) or
                   (.name | ascii_downcase | endswith(".zip"))
                 )]
              | sort_by(.size)
              | reverse
              | .[0].name // empty
            ' "$release_json"
          )"
          asset_url="$(
            jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              "$release_json"
          )"

          if [ -z "$asset_name" ] || [ -z "$asset_url" ]; then
            echo "::error::No toolchain archive asset found in ZyC release."
            exit 1
          fi

          echo "Selected toolchain asset: $asset_name"
          echo "Asset URL resolved successfully."

          archive="$RUNNER_TEMP/$asset_name"
          echo "Downloading asset: $asset_name"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            "$asset_url" -o "$archive"

          ls -lh "$archive"
          file "$archive"

          case "$asset_name" in
            *.zip)
              unzip -q "$archive" -d "$unpack"
              ;;
            *.tar.zst|*.tzst)
              tar --zstd --no-same-owner -xf "$archive" -C "$unpack"
              ;;
            *)
              tar --no-same-owner -xf "$archive" -C "$unpack"
              ;;
          esac

          echo "Looking for clang entry after extraction..."
          clang_bin="$(find "$unpack" -path '*/bin/clang' -print -quit)"

          if [ -z "$clang_bin" ]; then
            echo "::error::Could not find bin/clang after extracting $asset_name."
            echo "Top-level extracted entries:"
            find "$unpack" -maxdepth 3 -print | sed -n '1,120p'
            echo "Clang-like entries:"
            find "$unpack" -maxdepth 5 \( -name 'clang' -o -name 'clang-*' \) -print | sed -n '1,120p'
            exit 1
          fi

          echo "Found clang entry: $clang_bin"
          ls -l "$clang_bin"

          # bin/clang may be a symlink (common in Android clang toolchains).
          clang_real="$(readlink -f "$clang_bin")"
          if [ ! -x "$clang_real" ]; then
            echo "::error::Resolved clang is not executable: $clang_real"
            exit 1
          fi

          toolchain="$(dirname "$(dirname "$clang_bin")")"
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

          echo "Resolved toolchain: $toolchain"
          "$clang_real" --version | head -n 2
          "$toolchain/bin/ld.lld" --version | head -n 1

      - name: Clone pinned upstream AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          parent="$(mktemp -d "$RUNNER_TEMP/AnyKernel3-A325N.XXXXXX")"
          ak3="$parent/repository"

          git clone --filter=blob:none "$ANYKERNEL_REPO" "$ak3"
          git -C "$ak3" checkout --detach "$ANYKERNEL_COMMIT"

          resolved="$(git -C "$ak3" rev-parse HEAD)"
          if [ "$resolved" != "$ANYKERNEL_COMMIT" ]; then
            echo "::error::Unexpected AnyKernel3 commit: $resolved"
            exit 1
          fi

          test -s "$GITHUB_WORKSPACE/anykernel/a325n-anykernel.sh"

          echo "AK3_DIR=$ak3" >> "$GITHUB_ENV"
          echo "ANYKERNEL_RESOLVED_COMMIT=$resolved" >> "$GITHUB_ENV"

      - name: Show build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "Kernel commit : $(git rev-parse HEAD)"
          echo "Kernel branch : ${GITHUB_REF_NAME}"
          echo "ReSukiSU SHA  : $(git -C KernelSU rev-parse HEAD)"
          echo "ReSukiSU desc : $(git -C KernelSU describe --tags --always --dirty)"
          echo "AnyKernel SHA : $ANYKERNEL_RESOLVED_COMMIT"
          echo "Disk before build:"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_a325n.sh ./package_anykernel.sh
          TOOLCHAIN="$TOOLCHAIN" \
          OUT_DIR="$OUT_DIR" \
          ./build_a325n.sh 2>&1 | tee "$RUNNER_TEMP/a325n-build.log"

      - name: Verify kernel outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          test -s "$OUT_DIR/arch/arm64/boot/Image.gz"
          grep -q '^CONFIG_NOMOUNT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_ALWAYS_ENFORCE=y$' "$OUT_DIR/.config"
          cat "$OUT_DIR/include/config/kernel.release"
          sha256sum \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$OUT_DIR/arch/arm64/boot/Image.gz"

      - name: Package AnyKernel ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          TOOLCHAIN="$TOOLCHAIN" \
          OUT_DIR="$OUT_DIR" \
          AK3_DIR="$AK3_DIR" \
          AK3_CONFIG="$GITHUB_WORKSPACE/anykernel/a325n-anykernel.sh" \
          ZIP_OUT_DIR="$PACKAGE_DIR" \
          ./package_anykernel.sh | tee "$RUNNER_TEMP/a325n-package.log"

          zip_path="$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$zip_path" ] || [ ! -s "$zip_path" ]; then
            echo '::error::Flashable ZIP was not created.'
            exit 1
          fi

          unzip -tq "$zip_path"
          packaged_anykernel="$RUNNER_TEMP/packaged-anykernel.sh"
          unzip -p "$zip_path" anykernel.sh > "$packaged_anykernel"

          grep -q '^device\.name1=a32$' "$packaged_anykernel" || {
            echo '::error::A325N device configuration is missing from the ZIP.'
            exit 1
          }
          grep -Eq '^BLOCK=/dev/block/by-name/boot;?$' "$packaged_anykernel" || {
            echo '::error::A325N boot partition configuration is missing from the ZIP.'
            exit 1
          }
          if grep -Eq 'maguro|toro|toroplus|tuna|omap_hsmmc' "$packaged_anykernel"; then
            echo '::error::Stock Galaxy Nexus AnyKernel configuration was packaged.'
            exit 1
          fi

          echo 'Packaged AnyKernel configuration:'
          grep -E '^(kernel\.string|do\.devicecheck|device\.name[0-9]+|BLOCK)=' \
            "$packaged_anykernel"

          kernel_sha="$(git rev-parse HEAD)"
          kernel_short="$(git rev-parse --short=10 HEAD)"
          ksu_sha="$(git -C KernelSU rev-parse HEAD)"
          ksu_desc="$(git -C KernelSU describe --tags --always)"
          ksu_count="$(git -C KernelSU rev-list --count HEAD)"
          ksu_code="$((30700 + ksu_count))"
          susfs="$(sed -n 's/^#define SUSFS_VERSION "\([^"]*\)"/\1/p' include/linux/susfs.h | head -n1)"
          kernel_release="$(cat "$OUT_DIR/include/config/kernel.release")"

          sha256sum "$zip_path" > "$PACKAGE_DIR/SHA256SUMS.txt"
          sha256sum \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$OUT_DIR/arch/arm64/boot/Image.gz" \
            >> "$PACKAGE_DIR/SHA256SUMS.txt"

          cat > "$PACKAGE_DIR/build-info.txt" <<EOF
          Kernel commit: $kernel_sha
          Kernel short: $kernel_short
          Kernel release: $kernel_release
          ReSukiSU commit: $ksu_sha
          ReSukiSU describe: $ksu_desc
          ReSukiSU version code: $ksu_code
          SUSFS: $susfs
          Toolchain release: $TOOLCHAIN_REPO@$TOOLCHAIN_RELEASE
          AnyKernel upstream: $ANYKERNEL_REPO@$ANYKERNEL_RESOLVED_COMMIT
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          echo "ARTIFACT_NAME=A325N-ReSukiSU-$kernel_short" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$(basename "$zip_path")" >> "$GITHUB_ENV"

          echo '--- build-info.txt ---'
          cat "$PACKAGE_DIR/build-info.txt"
          echo '--- SHA256SUMS.txt ---'
          cat "$PACKAGE_DIR/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.PACKAGE_DIR }}/*.zip
            ${{ env.PACKAGE_DIR }}/SHA256SUMS.txt
            ${{ env.PACKAGE_DIR }}/build-info.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          pattern: A325N-ReSukiSU-*
          path: release
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag='${{ inputs.release_tag }}'
            if [ -z "$tag" ]; then
              echo '::error::release_tag is required when publish_release is enabled manually.'
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*.zip release/SHA256SUMS.txt release/build-info.txt)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo '::error::No release assets found.'
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "A325N ReSukiSU $RELEASE_TAG" \
              --generate-notes
          fi
